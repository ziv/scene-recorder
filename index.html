<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene Recorder</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      /* The Cesium container is a fixed 4K surface, CSS-scaled to fit the window. */
      #viewport {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #cesiumContainer {
        /* Must keep its exact configured pixel size; the flex parent would
           otherwise shrink it to the window width. */
        flex-shrink: 0;
        transform-origin: center center;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.75);
        padding: 12px 16px;
        border-radius: 8px;
        min-width: 300px;
      }
      #hud button {
        font-size: 15px;
        padding: 8px 18px;
        cursor: pointer;
      }
      #hud button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      #status {
        margin-top: 8px;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-line;
      }
      #progressBar {
        margin-top: 6px;
        height: 6px;
        background: #333;
        border-radius: 3px;
        overflow: hidden;
        display: none;
      }
      #progressBar.active {
        display: block;
      }
      #progressFill {
        height: 100%;
        width: 0;
        background: #4caf50;
        transition: width 0.2s;
      }
    </style>
  </head>
  <body>
    <div id="viewport">
      <div id="cesiumContainer"></div>
    </div>
    <div id="hud">
      <button id="startBtn" disabled>Start Recording</button>
      <div id="progressBar"><div id="progressFill"></div></div>
      <div id="status">Loading…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
